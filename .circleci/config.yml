version: 2.1

setup: true

orbs:
  path_filtering: circleci/path-filtering@3.0.0

workflows:
  filter:
    jobs:
      - path_filtering/filter:
          mapping: |
            .circleci/.* gh true
            Makefile gh true
            area/gh/.* gh true
            internal/gh/.* gh true
            go.* gh true

            Makefile bump true
            bin.* bump true
            cmd/bump/.* bump true
            internal/app/.* bump true
            internal/config/.* bump true
            internal/inputs/.* bump true
            internal/log/.* bump true
            api/infraops/v2/.* bump true
            go.* bump true

            Makefile format true
            bin.* format true
            cmd/format/.* format true
            internal/config/.* format true
            internal/log/.* format true
            api/infraops/v2/.* format true
            go.* format true

            .circleci/.* cf true
            Makefile cf true
            area/cf/.* cf true
            internal/cf/.* cf true
            go.* cf true

            .circleci/.* do true
            Makefile do true
            area/do/.* do true
            internal/do/.* do true
            go.* do true

            .circleci/.* apps true
            Makefile apps true
            area/apps/.* apps true
            internal/app/.* apps true
            go.* apps true
          base-revision: origin/master
          resource_class: large
