environment: production
ai:
  client:
    timeout: 10m
  provider: openai
  openai:
    api_key: file:/etc/secrets/abgleich/openai-api-key
automerge:
  completion_check: "ci/circleci: wait-all"
  dependabot:
    exclude_repositories:
      - alexfalkowski/docker
cache:
  kind: ttlcache
  max_entries: 1024
  max_size: 4MB
cleanup:
  inactive_after: 720h
  interval: 24h
  timeout: 5m
github:
  client:
    timeout: 1m
    retry:
      attempts: 3
      strategy: exponential
      backoff: 1s
  owner: alexfalkowski
  app:
    id: 5427450
    installation_id: 174152088
    private_key: file:/etc/secrets/abgleich/github-app-private-key.pem
  webhook:
    secret: file:/etc/secrets/abgleich/github-webhook-secret
    timeout: 8s
review:
  code:
    model: gpt-6.1-sol
    reasoning_effort: high
    interval: 15m
    timeout: 20m
  sec:
    model: gpt-6.1-sol
    reasoning_effort: high
    interval: 15m
    timeout: 20m
scheduler:
  interval: 15m
  timeout: 5m
summarise:
  model: gpt-6.1-sol
  interval: 30s
  timeout: 2m
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: text
    level: info
transport:
  http:
    timeout: 9s
    max_receive_size: 1048576B
