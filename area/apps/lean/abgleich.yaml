environment: production
github:
  client:
    timeout: 1m
    retry:
      attempts: 2
      backoff: 100ms
  owner: alexfalkowski
  app:
    id: 5427450
    installation_id: 174152088
    private_key: file:/etc/secrets/abgleich/github-app-private-key.pem
  webhook:
    secret: file:/etc/secrets/abgleich/github-webhook-secret
    timeout: 8s
scheduler:
  interval: 15m
  timeout: 5m
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: text
    level: info
transport:
  http:
    timeout: 9s
    max_receive_size: 1048576B
