environment: production
ai:
  providers:
    openai:
      client:
        timeout: 10m
      kind: openai
      api_key: file:/etc/secrets/abgleich/openai-api-key
      url: https://api.openai.com/v1/
automerge:
  completion_check: "ci/circleci: wait-all"
  dependabot:
    exclude_repositories:
      - alexfalkowski/docker
cache:
  kind: ttlcache
  max_entries: 1024
  max_size: 4MB
cleanup:
  inactive_after: 720h
  interval: 24h
  timeout: 5m
github:
  client:
    timeout: 1m
    retry:
      attempts: 3
      strategy: exponential
      backoff: 1s
  url: https://api.github.com/
  owner: alexfalkowski
  app:
    id: 5427450
    installation_id: 174152088
    private_key: file:/etc/secrets/abgleich/github-app-private-key.pem
  webhook:
    secret: file:/etc/secrets/abgleich/github-webhook-secret
    timeout: 8s
review:
  go_docs: https://go.dev/doc
  module_proxy: https://proxy.golang.org
  gem_registry: https://rubygems.org
  code:
    provider: openai
    model: gpt-6.2-sol
    effort: high
    interval: 15m
    timeout: 20m
  sec:
    provider: openai
    model: gpt-6.2-sol
    effort: high
    interval: 15m
    timeout: 20m
  test:
    provider: openai
    model: gpt-6.2-sol
    effort: high
    interval: 15m
    timeout: 20m
scheduler:
  interval: 15m
  timeout: 5m
summarise:
  provider: openai
  model: gpt-6.2-sol
  effort: medium
  interval: 30s
  timeout: 2m
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: otlp
    level: info
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
  metrics:
    kind: otlp
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
  tracer:
    kind: otlp
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
transport:
  http:
    timeout: 9s
    max_receive_size: 1048576B
