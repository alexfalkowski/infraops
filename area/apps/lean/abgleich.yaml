environment: production
ai:
  client:
    timeout: 1m
  provider: openai
  openai:
    api_key: file:/etc/secrets/abgleich/openai-api-key
automerge:
  completion_check: "ci/circleci: wait-all"
cleanup:
  inactive_after: 720h
  interval: 24h
  timeout: 5m
github:
  client:
    timeout: 1m
    retry:
      attempts: 2
      backoff: 100ms
  owner: alexfalkowski
  app:
    id: 5427450
    installation_id: 174152088
    private_key: file:/etc/secrets/abgleich/github-app-private-key.pem
  webhook:
    secret: file:/etc/secrets/abgleich/github-webhook-secret
    timeout: 8s
scheduler:
  interval: 15m
  timeout: 5m
summarise:
  model: gpt-6.1-sol
  interval: 30s
  timeout: 2m
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: text
    level: info
transport:
  http:
    timeout: 9s
    max_receive_size: 1048576B
