environment: production
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: otlp
    level: info
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
  metrics:
    kind: otlp
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
  tracer:
    kind: otlp
    protocol: grpc
    endpoint: einblick.lean.svc.cluster.local:9090
transport:
  http:
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
