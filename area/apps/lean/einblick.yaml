environment: production
queries:
  max_results: 100
  max_range: 168h
  timeout: 5s
  concurrency: 1
duckdb:
  path: /data/recent.duckdb
  memory_limit: 256MiB
  threads: 1
archive:
  workspace: /staging
  interval: 1m
  r2:
    client:
      endpoint: https://561357e2a2b66ddfeabd46e2965d2c67.r2.cloudflarestorage.com
      timeout: 5s
    bucket: einblick
    region: auto
    retention: 168h
    access_key_id: file:/etc/secrets/einblick/r2-access-key-id
    secret_access_key: file:/etc/secrets/einblick/r2-secret-access-key
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: text
    level: info
transport:
  http:
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
  grpc:
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
