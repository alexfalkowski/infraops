environment: production
queries:
  max_results: 100
  max_range: 168h
  timeout: 5s
  concurrency: 1
duckdb:
  path: /data/recent.duckdb
  memory_limit: 64MiB
  threads: 1
health:
  duration: 1s
  timeout: 1s
id:
  kind: ksuid
telemetry:
  logger:
    kind: text
    level: info
transport:
  http:
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
  grpc:
    limiter:
      kind: service-method
      tokens: 1000
      interval: 1s
    timeout: 5s
